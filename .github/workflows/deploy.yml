name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          # Served from https://robypisco.github.io/la-tua-stella/. With a custom domain:
          # BASE_PATH '' and VITE_SITE_URL set to the domain.
          BASE_PATH: /la-tua-stella
          VITE_SITE_URL: https://robypisco.github.io/la-tua-stella
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build
          # Keep account storage low: the site is redeployed on every push anyway.
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
