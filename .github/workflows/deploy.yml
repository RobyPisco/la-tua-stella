name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Weekly rebuild: ages, "light that left in…" years and upcoming moons stay current.
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
        env:
          # Served at the root of the custom domain (set in the repository's Pages settings);
          # GitHub redirects the old robypisco.github.io/la-tua-stella/ addresses here.
          BASE_PATH: ''
          VITE_SITE_URL: https://skyofyourday.com
          # Public "maps made" counter (worker/): only the real site counts.
          VITE_COUNTER_URL: https://api.skyofyourday.com
      - uses: actions/upload-pages-artifact@v4
        with:
          path: build
          # Keep account storage low: the site is redeployed on every push anyway.
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
